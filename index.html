<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Links</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", sans-serif;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(
            135deg,
            #dbeafe,
            #e0e7ff,
            #f5f3ff
        );
        color: #1f2937;
    }

    .container {
        width: 90%;
        max-width: 420px;
        text-align: center;
        padding: 2rem;
    }

    .profile-pic {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        object-fit: cover;
        border: 4px solid rgba(255,255,255,0.7);
        box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        margin-bottom: 1rem;
    }

    h1 {
        font-size: 2rem;
        margin-bottom: 0.5rem;
    }

    p {
        color: #4b5563;
        margin-bottom: 2rem;
    }

    .links {
        display: flex;
        flex-direction: column;
        gap: 1rem;
    }

    .link-btn {
        display: block;
        text-decoration: none;
        background: rgba(255,255,255,0.8);
        backdrop-filter: blur(10px);
        color: #111827;
        padding: 14px;
        border-radius: 14px;
        font-weight: 600;
        transition: all 0.25s ease;
        box-shadow: 0 6px 15px rgba(0,0,0,0.08);
    }

    .link-btn:hover {
        transform: translateY(-3px);
        background: white;
        box-shadow: 0 10px 20px rgba(0,0,0,0.12);
    }

    footer {
        margin-top: 2rem;
        font-size: 0.85rem;
        color: #6b7280;
    }
</style>
</head>
<body>

<div class="container">
    <img src="profile.jpg" alt="Profile Picture" class="profile-pic">

    <h1>Your Name</h1>
    <p>Welcome to my corner of the internet ✨</p>

    <div class="links">
        <a href="#" class="link-btn" target="_blank">📸 Instagram</a>
        <a href="#" class="link-btn" target="_blank">🎵 TikTok</a>
        <a href="#" class="link-btn" target="_blank">▶️ YouTube</a>
        <a href="https://x.com/reemmyboi" class="link-btn" target="_blank">🐦 X / Twitter</a>
        <a href="#" class="link-btn" target="_blank">💼 LinkedIn</a>
        <a href="https://www.twitch.tv/reemmy_" class="link-btn" target="_blank">🎮 Twitch</a>
    </div>

    <footer>
        © 2026 Your Name
    </footer>
</div>

</body>
</html>
